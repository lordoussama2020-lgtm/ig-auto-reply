services:
  - type: web
    name: ig-auto-reply
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: DRY_RUN
        value: "1"
      - key: REPLY_DELAY_MS
        value: "12000"
      - key: POLL_MEDIA_IDS
        sync: false
      - key: POLL_INTERVAL_MIN
        value: "5"
      - key: GRAPH_VERSION
        value: v21.0
